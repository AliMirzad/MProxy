[package]
name = "private-proxy-host"
version = "1.0.0"
edition = "2021"
description = "Native messaging host for the Private Proxy browser extension (manages Xray-core)"
license = "MIT"
publish = false

[[bin]]
name = "private-proxy-host"
path = "src/main.rs"

[lib]
name = "ppcore"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chacha20poly1305 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "socks"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
