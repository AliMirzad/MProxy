[package]
name = "windows-redirector-poc"
version = "0.0.0"
edition = "2021"
publish = false
description = "EXPERIMENTAL Phase 8: local redirector for WFP connect-redirected connections. Never packaged."

[dependencies]
ppcore = { package = "private-proxy-host", path = "../../native" }
per-app-routing-poc = { path = "../per-app-routing-poc" }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Threading",
    "Win32_System_IO",
]

[[bin]]
name = "redirector"
path = "src/bin/redirector.rs"

[[bin]]
name = "unaware-client"
path = "src/bin/unaware-client.rs"

[[bin]]
name = "phase8-harness"
path = "src/bin/phase8-harness.rs"
